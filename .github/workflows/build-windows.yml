name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller

      - name: Build single EXE
        working-directory: windows_package
        run: |
          pyinstaller --noconsole --onefile --clean --collect-all webview --name "TurtleNeckGuard" --add-data "index.html;." windows_app.py
          python -c "import shutil; shutil.copy2('dist/TurtleNeckGuard.exe', 'dist/\uac70\ubd81\ubaa9\uad50\uc815\uae30.exe')"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurtleNeckGuard-Windows
          path: windows_package/dist/거북목교정기.exe

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Windows 실행 파일 (v1.0.${{ github.run_number }})
          files: windows_package/dist/거북목교정기.exe
